# @package _global_
defaults:
  - /datamodule: cath_4.3       # ['cath_4.2', 'cath_4.3']
  - /callbacks: fixedbb
  - /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

# name of the run determines folder name in logs
name: "fixedbb/cath_4.2/surf_design_esm2_650m"

datamodule:
  alphabet:
    name: esm
    featurizer: cath
    featurizer_cfg:
      surf_path: '${paths.data_dir}/cath_4.3/surface_${datamodule.surf_mode}_bb.lmdb'   # todo: automatically +bb +cath4.3

model:
  _target_: esm2_adapter
  surf_encoder:
    in_dim: 2
    feat_dim: 16
    m_dim: 16
    num_spherical: 4
    num_radial: 3
    cutoff: 5.0
    update_coors: false
    norm_coors: true
    coor_weights_clamp_value: 2.0
    dropout: 0.15
    n_layers: 3
  hetero:
    D_max: 10.0
    num_rbf: 16
  encoder:
    d_model: 128
    n_enc_layers: 3
    n_dec_layers: 3
    use_esm_alphabet: true
    dropout: 0.15

  use_bb: false
  name: esm2_t33_650M_UR50D
  use_lora: false
  lora_r: 4
  lora_alpha: 8
  dropout: 0.15
  adapter_layer_indices: [-1]
  separate_loss: true

task:
  _target_: fixedbb/cmlm
  alphabet: ${datamodule.alphabet}
  learning:
    noise: random_mask # enable cmlm training with uniform random masking
  criterion:
    _target_: src.modules.cross_entropy.Coord2SeqCrossEntropyLoss
    label_smoothing: 0.0
    ignore_index: 1
  optimizer:
    type: adamw
    _partial_: true
    lr: ${train.lr}
    betas: 
      - 0.9
      - 0.98
    weight_decay: 0.0001
  lr_scheduler:
    type: noam
    warmup_steps: 4000
    model_size: 128
    lr: ${train.lr}
    warmup_init_lr: 1e-07
  generator:
    max_iter: 5
    strategy: 'denoise'

train:
  seed: 42
  lr: 0.001
  monitor: "val/acc_median"
  mode: "max"

trainer:
  min_epochs: 10
  max_epochs: 10000
  gradient_clip_val: 0.0
  num_sanity_val_steps: 1
  reload_dataloaders_every_n_epochs: 1
  replace_sampler_ddp: false
  max_steps: 200_000